<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Elenco Partite</title>
</head>

<body>
    <nav>
        <a href="/tornei">Tornei</a> |
        <a href="/squadre">Squadre</a> |
        <a href="/giocatori">Giocatori</a> |
        <a href="/arbitri">Arbitri</a> |
        <a href="/partite">Partite</a> |
        <a href="/utenti" sec:authorize="hasRole('ADMIN')">Utenti</a>
    </nav>
    <hr>

    <h1>Tutte le Partite</h1>

    <a th:href="@{/admin/partita/nuova}" sec:authorize="hasRole('ADMIN')">Nuova partita</a>

    <ul>
        <li th:each="partita : ${elencoPartite}">
            <a th:href="@{'/partita/' + ${partita.id}}"
                th:text="${partita.squadraCasa.nome} + ' - ' + ${partita.squadraOspite.nome}">Casa - Ospite</a> -
            <span th:text="${partita.dataOra}">Data</span> -
            <span th:text="${partita.stato}">Stato</span>
        </li>
    </ul>

    <br>
    <a href="/tornei">Torna ai tornei</a>

</body>

</html>
