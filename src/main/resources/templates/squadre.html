<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Elenco Squadre</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
	<nav>
		<div class="nav-links">
			<a href="/tornei">Tornei</a> |
			<a href="/squadre">Squadre</a> |
			<a href="/giocatori">Giocatori</a> |
			<a href="/arbitri">Arbitri</a> |
			<a href="/partite">Partite</a> |
			<a href="/utenti" sec:authorize="hasRole('ADMIN')">Utenti</a>
		</div>
		<div>
			<a sec:authorize="!isAuthenticated()" href="/login">Accedi</a>
			<form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="POST"
				style="display: inline; background: none; padding: 0; border: none; box-shadow: none;">
				<button type="submit"
					style="background-color: #ef4444; padding: 6px 14px; font-size: 0.9rem;">Esci</button>
			</form>
		</div>
	</nav>

	<div class="content-wrap">
		<h1>Tutte le Squadre</h1>

		<div sec:authorize="hasRole('ADMIN')" style="margin: 20px 0;">
			<a th:href="@{/admin/squadra/nuova}" class="btn"
				style="background-color: var(--primary-green); color: white; padding: 8px 14px; border-radius: 6px;">+
				Nuova squadra</a>
		</div>

		<!-- Griglia a card stile galleria -->
		<div class="cards-grid">
			<div class="sport-card" th:each="squadra : ${elencoSquadre}">
				<img th:if="${squadra.logo != null}" th:src="@{'/uploads/squadre/' + ${squadra.logo}}"
					alt="Logo Squadra" />
				<h3 th:text="${squadra.nome}">Nome squadra</h3>
				<p>Città: <span th:text="${squadra.citta}">Città</span></p>
				<a th:href="@{'/squadra/' + ${squadra.id}}"
					style="background-color: var(--primary-green); color: white; padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; margin-top: 10px;">Visualizza</a>
			</div>
		</div>

		<br>
		<a href="/tornei">&larr; Torna ai tornei</a>
	</div>

	<footer>
		<div>
			<p>&copy; 2026 Gestione Torneo Calcistico. Tutti i diritti riservati.</p>
		</div>
		<div class="footer-links">
			<a href="/tornei">Home</a>
			<a href="/partite">Partite</a>
			<a href="/squadre">Squadre</a>
		</div>
	</footer>
</body>

</html>
