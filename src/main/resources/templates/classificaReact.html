<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Classifica (React)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <nav>
        <div class="nav-links">
            <a href="/tornei">Tornei</a> |
            <a href="/squadre">Squadre</a> |
            <a href="/giocatori">Giocatori</a> |
            <a href="/arbitri">Arbitri</a> |
            <a href="/partite">Partite</a> |
            <a href="/utenti" sec:authorize="hasRole('ADMIN')">Utenti</a>
        </div>
        <div>
            <a sec:authorize="!isAuthenticated()" href="/login">Accedi</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="POST"
                style="display: inline; background: none; padding: 0; border: none; box-shadow: none;">
                <button type="submit"
                    style="background-color: #ef4444; padding: 6px 14px; font-size: 0.9rem;">Esci</button>
            </form>
        </div>
    </nav>

    <div class="content-wrap">
        <h1>Classifica (componente React)</h1>
        <div id="root"></div>
    </div>

    <script th:inline="javascript">
        const torneoId = /*[[${torneoId}]]*/ 1;
    </script>

    <script type="text/babel">
        function Classifica() {
            const [classifica, setClassifica] = React.useState([]);
            const [caricamento, setCaricamento] = React.useState(true);

            React.useEffect(() => {
                fetch(`/api/torneo/${torneoId}/classifica`)
                    .then(response => response.json())
                    .then(dati => {
                        setClassifica(dati);
                        setCaricamento(false);
                    })
                    .catch(errore => {
                        console.error("Errore nel caricamento della classifica:", errore);
                        setCaricamento(false);
                    });
            }, []);

            if (caricamento) {
                return <p>Caricamento in corso...</p>;
            }

            return (
                <table>
                    <thead>
                        <tr>
                            <th>Pos.</th>
                            <th>Squadra</th>
                            <th>Punti</th>
                            <th>PG</th>
                            <th>V</th>
                            <th>P</th>
                            <th>S</th>
                            <th>GF</th>
                            <th>GS</th>
                            <th>DR</th>
                        </tr>
                    </thead>
                    <tbody>
                        {classifica.map((riga, indice) => (
                            <tr key={riga.squadra.id}>
                                <td>{indice + 1}</td>
                                <td>{riga.squadra.nome}</td>
                                <td>{riga.punti}</td>
                                <td>{riga.partiteGiocate}</td>
                                <td>{riga.vittorie}</td>
                                <td>{riga.pareggi}</td>
                                <td>{riga.sconfitte}</td>
                                <td>{riga.golFatti}</td>
                                <td>{riga.golSubiti}</td>
                                <td>{riga.differenzaReti}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Classifica />);
    </script>

    <footer>
        <div>
            <p>&copy; 2026 Gestione Torneo Calcistico. Tutti i diritti riservati.</p>
        </div>
        <div class="footer-links">
            <a href="/tornei">Home</a>
            <a href="/partite">Partite</a>
            <a href="/squadre">Squadre</a>
        </div>
    </footer>
</body>

</html>
