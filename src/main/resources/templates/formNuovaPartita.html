<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="${partita.id != null ? 'Modifica Partita' : 'Nuova Partita'}">Gestione Partita</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/form.css}" />
</head>

<body>
    <nav>
        <div class="nav-links">
            <a href="/tornei">Tornei</a> |
            <a href="/squadre">Squadre</a> |
            <a href="/giocatori">Giocatori</a> |
            <a href="/arbitri">Arbitri</a> |
            <a href="/partite">Partite</a> |
            <a href="/utenti" sec:authorize="hasRole('ADMIN')">Utenti</a> |
            <a href="/admin/analisi-fetch" sec:authorize="hasRole('ADMIN')">Analisi fetch</a>
        </div>
        <div>
            <a sec:authorize="!isAuthenticated()" href="/login">Accedi</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="POST"
                style="display: inline; background: none; padding: 0; border: none; box-shadow: none;">
                <button type="submit"
                    style="background-color: #ef4444; padding: 6px 14px; font-size: 0.9rem;">Esci</button>
            </form>
        </div>
    </nav>

    <div class="content-wrap">
        <h1 th:text="${partita.id != null ? 'Modifica Partita' : 'Inserisci una nuova partita'}">Gestione partita</h1>

        <form th:action="@{${partita.id != null ? '/admin/partita/edit/' + partita.id : '/admin/partita'}}"
            th:object="${partita}" method="POST">

            <input type="hidden" th:field="*{id}" />

            <div>
                <label for="dataOra">Data e ora:</label>
                <input type="datetime-local" id="dataOra" th:field="*{dataOra}" required />
            </div>

            <div>
                <label for="luogo">Luogo:</label>
                <input type="text" id="luogo" th:field="*{luogo}" required />
            </div>

            <div>
                <label for="stato">Stato:</label>
                <select id="stato" th:field="*{stato}">
                    <option value="SCHEDULED">SCHEDULED</option>
                    <option value="PLAYED">PLAYED</option>
                </select>
            </div>

            <div>
                <label for="goalsHome">Gol squadra casa:</label>
                <input type="number" id="goalsHome" th:field="*{goalsHome}" />
            </div>

            <div>
                <label for="goalsAway">Gol squadra ospite:</label>
                <input type="number" id="goalsAway" th:field="*{goalsAway}" />
            </div>

            <div>
                <label for="torneoId">Torneo:</label>
                <select id="torneoId" name="torneoId">
                    <option th:each="torneo : ${elencoTornei}" th:value="${torneo.id}" th:text="${torneo.nome}"
                        th:selected="${partita.torneo != null and partita.torneo.id == torneo.id}">Torneo</option>
                </select>
            </div>

            <div>
                <label for="squadraCasaId">Squadra Casa:</label>
                <select id="squadraCasaId" name="squadraCasaId">
                    <option th:each="squadra : ${elencoSquadre}" th:value="${squadra.id}" th:text="${squadra.nome}"
                        th:selected="${partita.squadraCasa != null and partita.squadraCasa.id == squadra.id}">Squadra
                    </option>
                </select>
            </div>

            <div>
                <label for="squadraOspiteId">Squadra Ospite:</label>
                <select id="squadraOspiteId" name="squadraOspiteId">
                    <option th:each="squadra : ${elencoSquadre}" th:value="${squadra.id}" th:text="${squadra.nome}"
                        th:selected="${partita.squadraOspite != null and partita.squadraOspite.id == squadra.id}">
                        Squadra
                    </option>
                </select>
            </div>

            <div>
                <label for="arbitroId">Arbitro:</label>
                <select id="arbitroId" name="arbitroId">
                    <option th:each="arbitro : ${elencoArbitri}" th:value="${arbitro.id}"
                        th:text="${arbitro.nome} + ' ' + ${arbitro.cognome}"
                        th:selected="${partita.arbitro != null and partita.arbitro.id == arbitro.id}">Arbitro</option>
                </select>
            </div>

            <div>
                <button type="submit" th:text="${partita.id != null ? 'Salva Modifiche' : 'Salva Partita'}">Salva
                    Partita</button>
            </div>

        </form>

        <br>
        <a href="/partite">&larr; Torna alla lista delle partite</a>
    </div>

    <footer>
        <div>
            <p>&copy; 2026 Gestione Torneo Calcistico. Tutti i diritti riservati.</p>
        </div>
        <div class="footer-links">
            <a href="/tornei">Home</a>
            <a href="/partite">Partite</a>
            <a href="/squadre">Squadre</a>
        </div>
    </footer>
</body>

</html>
