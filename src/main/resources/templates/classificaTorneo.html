<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Classifica</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/classifica.css}" />
</head>

<body>
    <nav>
        <div class="nav-links">
            <a href="/tornei">Tornei</a> |
            <a href="/squadre">Squadre</a> |
            <a href="/giocatori">Giocatori</a> |
            <a href="/arbitri">Arbitri</a> |
            <a href="/partite">Partite</a> |
            <a href="/utenti" sec:authorize="hasRole('ADMIN')">Utenti</a>
        </div>
        <div>
            <a sec:authorize="!isAuthenticated()" href="/login">Accedi</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="POST"
                style="display: inline; background: none; padding: 0; border: none; box-shadow: none;">
                <button type="submit"
                    style="background-color: #ef4444; padding: 6px 14px; font-size: 0.9rem;">Esci</button>
            </form>
        </div>
    </nav>

    <div class="content-wrap">
        <h1 th:text="'Classifica - ' + ${torneo.nome}">Classifica Torneo</h1>

        <table class="classifica-table">
            <thead>
                <tr>
                    <th>Pos.</th>
                    <th>Squadra</th>
                    <th>Punti</th>
                    <th>PG</th>
                    <th>V</th>
                    <th>P</th>
                    <th>S</th>
                    <th>GF</th>
                    <th>GS</th>
                    <th>DR</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="riga, stat : ${classifica}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${riga.squadra.nome}">Squadra</td>
                    <td th:text="${riga.punti}">0</td>
                    <td th:text="${riga.partiteGiocate}">0</td>
                    <td th:text="${riga.vittorie}">0</td>
                    <td th:text="${riga.pareggi}">0</td>
                    <td th:text="${riga.sconfitte}">0</td>
                    <td th:text="${riga.golFatti}">0</td>
                    <td th:text="${riga.golSubiti}">0</td>
                    <td th:text="${riga.differenzaReti}">0</td>
                </tr>
            </tbody>
        </table>

        <br>
        <a th:href="@{'/torneo/' + ${torneo.id}}">&larr; Torna al torneo</a>
    </div>

    <footer>
        <div>
            <p>&copy; 2026 Gestione Torneo Calcistico. Tutti i diritti riservati.</p>
        </div>
        <div class="footer-links">
            <a href="/tornei">Home</a>
            <a href="/partite">Partite</a>
            <a href="/squadre">Squadre</a>
        </div>
    </footer>
</body>

</html>
