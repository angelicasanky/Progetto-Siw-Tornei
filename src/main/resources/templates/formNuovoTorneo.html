<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Nuovo Torneo</title>
</head>

<body>
	<nav>
		<a href="/tornei">Tornei</a> |
		<a href="/squadre">Squadre</a> |
		<a href="/giocatori">Giocatori</a> |
		<a href="/arbitri">Arbitri</a> |
		<a href="/partite">Partite</a> |
		<a href="/utenti" sec:authorize="hasRole('ADMIN')">Utenti</a>
	</nav>
	<hr>

	<h1>Inserisci un nuovo torneo</h1>

	<form th:action="@{/admin/torneo}" th:object="${torneo}" method="POST" enctype="multipart/form-data">

		<div>
			<label for="nome">Nome del torneo</label>
			<input type="text" id="nome" th:field="*{nome}" required />
		</div>

		<div>
			<label for="anno">Anno:</label>
			<input type="number" id="anno" th:field="*{anno}" required />
		</div>

		<div>
			<label for="descrizione">Descrizione:</label>
			<textarea id="descrizione" th:field="*{descrizione}"></textarea>
		</div>

		<div>
			<label for="fileImmagine">Immagine Copertina:</label>
			<input type="file" id="fileImmagine" name="fileImmagine" accept="image/*" />
		</div>

		<div>
			<button type="submit">Salva Torneo</button>
		</div>

	</form>

	<br>
	<a href="/tornei">Torna alla lista dei tornei</a>

</body>

</html>
