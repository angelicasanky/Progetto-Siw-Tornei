<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title th:text="${torneo.id != null ? 'Modifica Torneo' : 'Nuovo Torneo'}">Gestione Torneo</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<link rel="stylesheet" th:href="@{/css/form.css}" />
</head>

<body>
	<nav>
		<div class="nav-links">
			<a href="/tornei">Tornei</a> |
			<a href="/squadre">Squadre</a> |
			<a href="/giocatori">Giocatori</a> |
			<a href="/arbitri">Arbitri</a> |
			<a href="/partite">Partite</a> |
			<a href="/utenti" sec:authorize="hasRole('ADMIN')">Utenti</a>
		</div>
		<div>
			<a sec:authorize="!isAuthenticated()" href="/login">Accedi</a>
			<form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="POST"
				style="display: inline; background: none; padding: 0; border: none; box-shadow: none;">
				<button type="submit"
					style="background-color: #ef4444; padding: 6px 14px; font-size: 0.9rem;">Esci</button>
			</form>
		</div>
	</nav>

	<div class="content-wrap">
		<h1 th:text="${torneo.id != null ? 'Modifica Torneo' : 'Inserisci un nuovo torneo'}">Gestione torneo</h1>

		<form th:action="@{${torneo.id != null ? '/admin/torneo/edit/' + torneo.id : '/admin/torneo'}}"
			th:object="${torneo}" method="POST" enctype="multipart/form-data">

			<input type="hidden" th:field="*{id}" />

			<div>
				<label for="nome">Nome del torneo</label>
				<input type="text" id="nome" th:field="*{nome}" required />
			</div>

			<div>
				<label for="anno">Anno:</label>
				<input type="number" id="anno" th:field="*{anno}" required />
			</div>

			<div>
				<label for="descrizione">Descrizione:</label>
				<textarea id="descrizione" th:field="*{descrizione}"></textarea>
			</div>

			<div>
				<label for="fileImmagine">Immagine Copertina:</label>
				<input type="file" id="fileImmagine" name="fileImmagine" accept="image/*" />
			</div>

			<div>
				<button type="submit" th:text="${torneo.id != null ? 'Salva Modifiche' : 'Salva Torneo'}">Salva
					Torneo</button>
			</div>

		</form>

		<br>
		<a href="/tornei">&larr; Torna alla lista dei tornei</a>
	</div>

	<footer>
		<div>
			<p>&copy; 2026 Gestione Torneo Calcistico. Tutti i diritti riservati.</p>
		</div>
		<div class="footer-links">
			<a href="/tornei">Home</a>
			<a href="/partite">Partite</a>
			<a href="/squadre">Squadre</a>
		</div>
	</footer>
</body>

</html>
